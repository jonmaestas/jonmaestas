<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="45s soccer ball-mastery drill timer. Self-paced rest — start each rep when ready. Voice: start / begin / go." />
  <title>Soccer Drill Timer — 45s self-paced</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --text: #f3f6ff;
      --muted: #9aa8c7;
      --work: #22c55e;
      --rest: #f59e0b;
      --done: #38bdf8;
      --danger: #ef4444;
      --btn: #1e293b;
      --btn-border: #334155;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--btn-border);
      border-radius: 999px;
      padding: 6px 12px;
    }

    .phase { font-weight: 700; color: var(--text); }
    .phase.work { color: var(--work); }
    .phase.rest { color: var(--rest); }
    .phase.done { color: var(--done); }
    .phase.ready { color: var(--muted); }

    /* --- Session progress bar with drill markers --- */
    .session-progress {
      width: min(480px, 100%);
      margin: 4px 0 8px;
    }
    .session-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .session-track {
      position: relative;
      height: 28px;
      background: #1f2937;
      border-radius: 8px;
      overflow: hidden;
    }
    .session-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #1e40af, #2563eb);
      transition: width 0.3s ease;
    }
    .session-markers {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      pointer-events: none;
    }
    .marker {
      flex: 1;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    .marker:last-child { border-right: none; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .label {
      font-size: 0.9rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .exercise {
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
      max-width: 20ch;
      min-height: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      font-size: clamp(5.5rem, 28vw, 8rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      margin: 8px 0 4px;
    }

    .timer.work { color: var(--work); }
    .timer.rest { color: var(--rest); }
    .timer.done { color: var(--done); }
    .timer.ready { color: var(--text); }

    .next {
      min-height: 3.2em;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.35;
      max-width: 28ch;
    }
    .next strong {
      color: var(--text);
      display: block;
      font-size: 1.1rem;
      margin-top: 2px;
    }

    .progress-wrap {
      width: min(420px, 100%);
      height: 8px;
      background: #1f2937;
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 4px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 0.2s linear;
    }
    .progress-bar.rest {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }

    /* --- Nav row: prev / skip --- */
    .nav-row {
      display: flex;
      gap: 12px;
      width: min(480px, 100%);
      margin-top: 6px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px 8px;
      font-size: 0.95rem;
      border-radius: 14px;
    }
    .nav-btn:disabled { opacity: 0.3; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: min(480px, 100%);
      margin-top: 8px;
    }

    button {
      appearance: none;
      border: 1px solid var(--btn-border);
      background: var(--btn);
      color: var(--text);
      border-radius: 16px;
      padding: 18px 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #startNow {
      grid-column: 1 / -1;
      background: #14532d;
      border-color: #166534;
      color: #dcfce7;
      font-size: 1.2rem;
      padding: 22px 14px;
    }
    #startNow:disabled {
      background: var(--btn);
      border-color: var(--btn-border);
      color: var(--muted);
    }
    #primary { background: #1d4ed8; border-color: #2563eb; }
    /* Big Start when waiting between drills */
    #primary.ready-go {
      grid-column: 1 / -1;
      background: #14532d;
      border-color: #166534;
      color: #dcfce7;
      font-size: 1.25rem;
      padding: 22px 14px;
    }
    #reset { background: #7f1d1d; border-color: #991b1b; }

    /* --- Voice button --- */
    #voiceBtn {
      width: min(480px, 100%);
      margin-top: 10px;
      padding: 12px 14px;
      font-size: 0.9rem;
      border-radius: 14px;
      background: #1a1040;
      border-color: #312e81;
      color: #a5b4fc;
    }
    #voiceBtn.listening {
      background: #5b21b6;
      border-color: #7c3aed;
      color: #ede9fe;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    #audioCuesBtn {
      width: min(480px, 100%);
      margin-top: 6px;
      padding: 12px 14px;
      font-size: 0.9rem;
      border-radius: 14px;
      background: #1e3a5f;
      border-color: #1e40af;
      color: #93c5fd;
    }
    #audioCuesBtn.off {
      background: var(--btn);
      border-color: var(--btn-border);
      color: var(--muted);
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    .list-toggle {
      margin-top: 14px;
      width: min(480px, 100%);
    }

    details {
      background: var(--panel);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      padding: 10px 14px;
    }
    summary {
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }

    ol {
      margin: 10px 0 4px;
      padding-left: 0;
      list-style: none;
      counter-reset: drill;
    }
    ol li {
      counter-increment: drill;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    ol li:last-child { border-bottom: none; }
    ol li::before {
      content: counter(drill);
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
    }
    ol li.current {
      color: var(--text);
      font-weight: 700;
      background: rgba(37,99,235,0.15);
      border-radius: 8px;
    }
    ol li.current::before {
      background: #2563eb;
      color: #fff;
    }
    ol li.done-item {
      opacity: 0.5;
    }
    ol li.done-item::before {
      background: #166534;
      color: #4ade80;
    }
    ol li.done-item::after {
      content: "✓";
      color: var(--work);
      font-weight: 700;
      margin-left: auto;
    }

    footer {
      margin-top: 12px;
      text-align: center;
      color: #64748b;
      font-size: 0.75rem;
    }

    body.flash-work { background: #052e16; }
    body.flash-rest { background: #451a03; }
    body.flash-done { background: #0c4a6e; }
  </style>
</head>
<body>
  <div class="top">
    <div class="badge" id="countBadge">1 / 17</div>
    <div class="badge phase ready" id="phaseBadge">Ready</div>
  </div>

  <!-- Session progress bar with drill markers -->
  <div class="session-progress">
    <div class="session-label">
      <span>Session Progress</span>
      <span id="sessionPct">0%</span>
    </div>
    <div class="session-track">
      <div class="session-fill" id="sessionFill"></div>
      <div class="session-markers" id="sessionMarkers"></div>
    </div>
  </div>

  <main>
    <div class="label" id="phaseLabel">Tap Start when ready</div>
    <div class="exercise" id="exerciseName">Tick tocks/Foundations</div>
    <div class="timer ready" id="timer">0:45</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="next" id="nextBox">
      Next up
      <strong id="nextName">Triangles (Right Foot)</strong>
    </div>
  </main>

  <!-- Nav: prev / skip -->
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" type="button">⏮ Prev Drill</button>
    <button class="nav-btn" id="skipBtn" type="button">Skip ⏭</button>
  </div>

  <div class="controls">
    <button id="primary" type="button" class="ready-go">Start</button>
    <button id="reset" type="button">Restart Drill</button>
  </div>

  <button id="voiceBtn" type="button">🎙 Voice Off — tap to enable</button>
  <button id="audioCuesBtn" type="button">🔊 Audio Cues On</button>

  <p class="hint">45s work · rest as long as you need · Start or say “start / begin / go”</p>

  <div class="list-toggle">
    <details>
      <summary>Full drill list — tap to jump</summary>
      <ol id="drillList"></ol>
    </details>
  </div>

  <footer>jonmaestas.com · ball mastery timer</footer>

  <script>
    const DRILLS = [
      "Tick tocks/Foundations",
      "Triangles (Right Foot)",
      "Triangles (Left Foot)",
      "Drag/Push (Laces)",
      "Inside-Outside (both feet)",
      "Toe Taps",
      "Drag Push (Instep)",
      "Double Taps",
      "Squeeze & Push",
      "Sole Rolls/Sole Touches",
      "Slap",
      "Body Triangles (Alternate feet)",
      "Pull, Outside of Foot Push",
      "Roll Stops",
      "Inside/Outside (Right)",
      "Inside/Outside (Left)",
      "Brazilian Toe Touches"
    ];

    const WORK_SEC = 45;

    const els = {
      countBadge: document.getElementById("countBadge"),
      phaseBadge: document.getElementById("phaseBadge"),
      phaseLabel: document.getElementById("phaseLabel"),
      exerciseName: document.getElementById("exerciseName"),
      timer: document.getElementById("timer"),
      progressBar: document.getElementById("progressBar"),
      nextBox: document.getElementById("nextBox"),
      nextName: document.getElementById("nextName"),
      primary: document.getElementById("primary"),
      reset: document.getElementById("reset"),
      drillList: document.getElementById("drillList"),
      prevBtn: document.getElementById("prevBtn"),
      skipBtn: document.getElementById("skipBtn"),
      voiceBtn: document.getElementById("voiceBtn"),
      audioCuesBtn: document.getElementById("audioCuesBtn"),
      sessionFill: document.getElementById("sessionFill"),
      sessionPct: document.getElementById("sessionPct"),
      sessionMarkers: document.getElementById("sessionMarkers"),
    };

    let index = 0;
    let phase = "ready"; // ready | work | done
    let remaining = WORK_SEC;
    let phaseTotal = WORK_SEC;
    let running = false;
    let rafId = null;
    let endAt = 0;
    let wakeLock = null;
    let audioCtx = null;

    // Track which drills have been completed (for session %)
    let completedDrills = new Set();

    // --- Build session markers ---
    function buildMarkers() {
      els.sessionMarkers.innerHTML = DRILLS.map(() => '<div class="marker"></div>').join("");
    }
    buildMarkers();

    function fmt(sec) {
      const s = Math.max(0, Math.ceil(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ":" + String(r).padStart(2, "0");
    }

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    }

    // ========== SPOKEN CUES ==========
    let audioCuesEnabled = true;

    function speak(text, opts) {
      opts = opts || {};
      if (!audioCuesEnabled) return;
      if (!("speechSynthesis" in window)) return;
      try {
        if (!opts.queue) speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = opts.rate || 1.15;
        u.pitch = opts.pitch || 1.0;
        u.volume = opts.volume || 1.0;
        if (opts.lang) u.lang = opts.lang;
        speechSynthesis.speak(u);
      } catch (_) {}
    }

    // ========== SUSTAINED BELL ==========
    function playBell(durationSec) {
      durationSec = durationSec || 4;
      try {
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        // Bell harmonics — C5 major chord with long decay
        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach((f, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(f, now);
          o.type = i === 0 ? "sine" : "triangle";
          const peak = 0.18 / (i + 1);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(peak, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);
          o.start(now);
          o.stop(now + durationSec + 0.1);
        });
      } catch (_) {}
    }

    function beep(kind) {
      try {
        ensureAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g);
        g.connect(audioCtx.destination);

        if (kind === "work") {
          o.frequency.setValueAtTime(880, now);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          o.start(now); o.stop(now + 0.2);
        } else if (kind === "rest") {
          o.frequency.setValueAtTime(523.25, now);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
          o.start(now); o.stop(now + 0.28);
        } else if (kind === "tick") {
          o.type = "square";
          o.frequency.setValueAtTime(660, now);
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.08, now + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          o.start(now); o.stop(now + 0.09);
        } else if (kind === "done") {
          [523.25, 659.25, 783.99].forEach((f, i) => {
            const o2 = audioCtx.createOscillator();
            const g2 = audioCtx.createGain();
            o2.connect(g2); g2.connect(audioCtx.destination);
            const t = now + i * 0.14;
            o2.frequency.setValueAtTime(f, t);
            g2.gain.setValueAtTime(0.0001, t);
            g2.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
            g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
            o2.start(t); o2.stop(t + 0.24);
          });
        }
      } catch (_) {}
      if (navigator.vibrate) {
        if (kind === "work") navigator.vibrate([40, 40, 80]);
        else if (kind === "rest") navigator.vibrate(60);
        else if (kind === "done") navigator.vibrate([80, 40, 80, 40, 120]);
        else if (kind === "tick") navigator.vibrate(20);
      }
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (_) {}
    }
    async function releaseWakeLock() {
      try { if (wakeLock) await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }

    function flash(kind) {
      document.body.classList.remove("flash-work", "flash-rest", "flash-done");
      const cls = kind === "work" ? "flash-work" : kind === "rest" ? "flash-rest" : kind === "done" ? "flash-done" : "";
      if (!cls) return;
      document.body.classList.add(cls);
      setTimeout(() => document.body.classList.remove(cls), 280);
    }

    function renderList() {
      els.drillList.innerHTML = DRILLS.map((name, i) => {
        let cls = "";
        if (completedDrills.has(i)) cls = "done-item";
        if (i === index && phase !== "done") cls += (cls ? " " : "") + "current";
        return `<li class="${cls}" data-idx="${i}">${name}</li>`;
      }).join("");
      // Wire up click-to-jump
      els.drillList.querySelectorAll("li").forEach((li) => {
        li.addEventListener("click", () => {
          const idx = parseInt(li.dataset.idx, 10);
          jumpToDrill(idx);
        });
      });
    }

    function setPhaseClasses(p) {
      els.timer.className = "timer " + p;
      els.phaseBadge.className = "badge phase " + p;
      els.progressBar.className = "progress-bar";
    }

    function updateSessionProgress() {
      const total = DRILLS.length;
      let pct;
      if (phase === "done") {
        pct = 100;
      } else {
        const drillFraction = completedDrills.size / total;
        let inDrillFraction = 0;
        if (phase === "work") {
          inDrillFraction = (1 - remaining / WORK_SEC) / total;
        }
        // ready between drills: completed already counts; no partial
        pct = Math.round((drillFraction + inDrillFraction) * 100);
      }
      pct = Math.max(0, Math.min(100, pct));
      els.sessionFill.style.width = pct + "%";
      els.sessionPct.textContent = pct + "%";
    }

    function updateUI() {
      const total = DRILLS.length;
      els.countBadge.textContent = (phase === "done" ? total : index + 1) + " / " + total;
      els.exerciseName.textContent = phase === "done" ? "Session complete" : DRILLS[index];
      els.timer.textContent = fmt(remaining);

      const pct = phaseTotal > 0 ? ((phaseTotal - remaining) / phaseTotal) * 100 : 100;
      els.progressBar.style.width = Math.min(100, Math.max(0, pct)) + "%";

      if (phase === "ready") {
        els.phaseBadge.textContent = "Ready";
        els.phaseLabel.textContent = completedDrills.size > 0
          ? "Rest as long as you need — then Start"
          : "Tap Start when ready";
        els.nextBox.style.visibility = index < total - 1 ? "visible" : "hidden";
        els.nextName.textContent = index < total - 1 ? DRILLS[index + 1] : "—";
        els.primary.textContent = "Start";
        els.primary.classList.add("ready-go");
        els.primary.disabled = false;
        els.prevBtn.disabled = (index === 0);
        els.skipBtn.disabled = (index >= total - 1);
        els.reset.textContent = "Restart Drill";
        // Show full work time while waiting
        els.timer.textContent = fmt(WORK_SEC);
        els.progressBar.style.width = "0%";
      } else if (phase === "work") {
        els.phaseBadge.textContent = "Work";
        els.phaseLabel.textContent = "Go!";
        els.nextBox.style.visibility = index < total - 1 ? "visible" : "hidden";
        els.nextName.textContent = index < total - 1 ? DRILLS[index + 1] : "Last drill";
        els.primary.textContent = running ? "Pause" : "Resume";
        els.primary.classList.remove("ready-go");
        els.primary.disabled = false;
        els.prevBtn.disabled = (index === 0);
        els.skipBtn.disabled = (index >= total - 1);
        els.reset.textContent = "Restart Drill";
      } else if (phase === "done") {
        els.phaseBadge.textContent = "Done";
        els.phaseLabel.textContent = "Nice work";
        els.nextBox.style.visibility = "hidden";
        els.primary.textContent = "Restart session";
        els.primary.classList.add("ready-go");
        els.primary.disabled = false;
        els.prevBtn.disabled = true;
        els.skipBtn.disabled = true;
        els.timer.textContent = "0:00";
        els.progressBar.style.width = "100%";
      }

      setPhaseClasses(phase);
      renderList();
      updateSessionProgress();
    }

    function stopLoop() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
    }

    function enterWork() {
      phase = "work";
      phaseTotal = WORK_SEC;
      remaining = WORK_SEC;
      endAt = performance.now() + WORK_SEC * 1000;
      beep("work");
      flash("work");
      // Speak the drill name so she never has to look at the screen
      speak(DRILLS[index]);
      updateUI();
      if (!running) startLoop();
    }

    /** After work: advance to next drill and wait — rest is self-paced */
    function enterReadyNext() {
      stopLoop();
      completedDrills.add(index);
      if (index >= DRILLS.length - 1) {
        finishSession();
        return;
      }
      index += 1;
      phase = "ready";
      phaseTotal = WORK_SEC;
      remaining = WORK_SEC;
      beep("rest");
      flash("rest");
      speak("Done. Next: " + DRILLS[index] + ". Say start when ready.");
      updateUI();
    }

    function finishSession() {
      completedDrills.add(index);
      stopLoop();
      phase = "done";
      remaining = 0;
      phaseTotal = 1;
      releaseWakeLock();
      speak("Session complete. Great work!");
      playBell(4);
      flash("done");
      updateUI();
    }

    function tick() {
      if (!running) return;
      const msLeft = endAt - performance.now();
      const prevCeil = Math.ceil(remaining);
      remaining = Math.max(0, msLeft / 1000);
      const nextCeil = Math.ceil(remaining);

      if (nextCeil !== prevCeil && nextCeil > 0) {
        if (phase === "work" && nextCeil <= 10) {
          speak(String(nextCeil), { rate: 1.6 });
          if (nextCeil <= 3) beep("tick");
        }
      }

      updateUI();

      if (msLeft <= 0) {
        if (phase === "work") enterReadyNext();
      }

      if (running) rafId = requestAnimationFrame(tick);
    }

    function startLoop() {
      running = true;
      requestWakeLock();
      ensureAudio();
      rafId = requestAnimationFrame(tick);
    }

    function pause() {
      if (!running) return;
      remaining = Math.max(0, (endAt - performance.now()) / 1000);
      stopLoop();
      updateUI();
    }

    function resume() {
      if (running || phase !== "work") return;
      endAt = performance.now() + remaining * 1000;
      startLoop();
      updateUI();
    }

    function startSession() {
      ensureAudio();
      index = 0;
      completedDrills.clear();
      enterWork();
    }

    /** Start the drill currently on screen (ready / mid-session) */
    function startCurrent() {
      ensureAudio();
      if (phase === "done") {
        startSession();
        return;
      }
      if (phase === "ready") enterWork();
    }

    // Restart ONLY the current drill (not the whole session)
    function restartCurrentDrill() {
      stopLoop();
      completedDrills.delete(index);
      enterWork();
    }

    // Jump to a specific drill — land on Ready so she starts when set
    function jumpToDrill(targetIdx, autoStart) {
      if (targetIdx < 0 || targetIdx >= DRILLS.length) return;
      stopLoop();
      index = targetIdx;
      for (let i = targetIdx; i < DRILLS.length; i++) completedDrills.delete(i);
      if (autoStart) {
        enterWork();
      } else {
        phase = "ready";
        remaining = WORK_SEC;
        phaseTotal = WORK_SEC;
        speak("Ready. " + DRILLS[index]);
        updateUI();
      }
    }

    function prevDrill() {
      if (index <= 0) return;
      jumpToDrill(index - 1, false);
    }

    function skipDrill() {
      if (index >= DRILLS.length - 1) return;
      completedDrills.add(index);
      jumpToDrill(index + 1, false);
    }

    els.primary.addEventListener("click", () => {
      ensureAudio();
      if (phase === "ready") startCurrent();
      else if (phase === "done") startSession();
      else if (running) pause();
      else resume();
    });

    els.reset.addEventListener("click", () => {
      restartCurrentDrill();
    });

    els.prevBtn.addEventListener("click", () => { prevDrill(); });
    els.skipBtn.addEventListener("click", () => { skipDrill(); });

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" && running) await requestWakeLock();
    });

    // ========== VOICE COMMANDS ==========
    let recognition = null;
    let voiceOn = false;

    function initVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        els.voiceBtn.textContent = "🎙 Voice not supported on this browser";
        els.voiceBtn.disabled = true;
        return;
      }
      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim().toLowerCase();
          if (transcript.includes("pause") || transcript.includes("hold")) {
            doCommand("pause");
          } else if (transcript.includes("begin") || transcript.includes("start") || /\bgo\b/.test(transcript)) {
            // start / begin / go → begin current drill or resume
            doCommand("start");
          } else if (transcript.includes("resume") || transcript.includes("continue")) {
            doCommand("resume");
          } else if (transcript.includes("skip") || transcript.includes("next")) {
            doCommand("skip");
          } else if (transcript.includes("restart") || transcript.includes("reset")) {
            doCommand("restart");
          } else if (transcript.includes("back") || transcript.includes("previous")) {
            doCommand("prev");
          }
        }
      };

      recognition.onerror = (e) => {
        if (e.error === "not-allowed") {
          els.voiceBtn.textContent = "🎙 Mic blocked — allow mic access";
          voiceOn = false;
        }
      };

      recognition.onend = () => {
        if (voiceOn) {
          try { recognition.start(); } catch (_) {}
        }
      };
    }

    let lastCommandTime = 0;
    const COMMAND_COOLDOWN = 800; // ms

    function doCommand(cmd) {
      const now = Date.now();
      if (now - lastCommandTime < COMMAND_COOLDOWN) return;
      lastCommandTime = now;

      switch (cmd) {
        case "pause":
          if (running) pause();
          break;
        case "resume":
          if (!running && phase === "work") resume();
          break;
        case "start":
          if (phase === "ready") startCurrent();
          else if (phase === "done") startSession();
          else if (phase === "work" && !running) resume();
          break;
        case "skip":
          skipDrill();
          break;
        case "restart":
          restartCurrentDrill();
          break;
        case "prev":
          prevDrill();
          break;
      }
    }

    els.voiceBtn.addEventListener("click", () => {
      if (!recognition) initVoice();
      if (!recognition) return;

      if (!voiceOn) {
        voiceOn = true;
        ensureAudio();
        try {
          recognition.start();
          els.voiceBtn.classList.add("listening");
          els.voiceBtn.textContent = "🔴 Listening — say: start, begin, go, pause, skip, back, restart";
        } catch (_) {}
      } else {
        voiceOn = false;
        try { recognition.stop(); } catch (_) {}
        els.voiceBtn.classList.remove("listening");
        els.voiceBtn.textContent = "🎙 Voice Off — tap to enable";
      }
    });

    // ========== AUDIO CUES TOGGLE ==========
    els.audioCuesBtn.addEventListener("click", () => {
      audioCuesEnabled = !audioCuesEnabled;
      els.audioCuesBtn.classList.toggle("off", !audioCuesEnabled);
      els.audioCuesBtn.textContent = audioCuesEnabled ? "🔊 Audio Cues On" : "🔇 Audio Cues Off";
      if (audioCuesEnabled) speak("Audio cues on", { rate: 1.3 });
      else speechSynthesis.cancel();
    });

    // Init UI
    updateUI();
  </script>
</body>
</html>
