<!DOCTYPE html>
<!-- Source of images/og.png (1200x630 link preview). Regenerate after changing it:
     python3 -m http.server 8765 &   (from the repo root)
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=images/og.png http://127.0.0.1:8765/scripts/og.html -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fafafa; color: #09090b;
    display: grid; grid-template-rows: auto 1fr auto; padding: 64px 72px 56px; box-sizing: border-box;
    background-image: radial-gradient(circle at 100% 0%, #dbeafe 0, transparent 45%);
  }
  .top { display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
  .top img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { margin: 44px 0 0; font-size: 66px; line-height: 1.04; letter-spacing: -0.04em; font-weight: 800; max-width: 900px; }
  .row { display: flex; gap: 22px; align-items: center; }
  .app { display: flex; align-items: center; gap: 14px; padding: 14px 20px 14px 14px; background: #fff; border: 1px solid #e4e4e7; border-radius: 20px; box-shadow: 0 10px 30px -18px rgb(0 0 0 / .35); }
  .app img { width: 56px; height: 56px; border-radius: 13px; }
  .app b { display: block; font-size: 21px; letter-spacing: -0.01em; }
  .app span { display: block; font-size: 16px; color: #52525b; margin-top: 2px; }
  .url { position: absolute; right: 72px; top: 72px; font-size: 22px; font-weight: 600; color: #1d4ed8; }
</style>
</head>
<body>
  <div class="top"><img src="/favicon.svg" alt="">Jon Maestas</div>
  <h1>Apps for athletes, coaches and families.</h1>
  <div class="row">
    <div class="app"><img src="/images/apps/player-1-athlete.webp" alt=""><div><b>Player 1</b><span>AI sports coach</span></div></div>
    <div class="app"><img src="/images/apps/diamond-setup.webp" alt=""><div><b>Diamond Setup</b><span>AR field layout</span></div></div>
    <div class="app"><img src="/images/products/reindeer-food.svg" alt=""><div><b>Reindeer Food Co.</b><span>Christmas Eve</span></div></div>
  </div>
  <div class="url">jonmaestas.com</div>
</body>
</html>
